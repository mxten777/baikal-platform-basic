# =============================================================================
# GitHub Actions CI/CD
# .github/workflows/ci.yml
#
# 트리거:
#   - main 브랜치 push → 타입 체크 + 린트 + 빌드 + 변경된 Supabase 작업
#   - develop 브랜치 push 또는 PR → 타입 체크 + 린트 + 빌드
#
# Vercel 배포는 별도 Git 연동이 담당한다. 이 CI 실패는 Vercel 배포를 차단하지 않는다.
#
# 필요한 GitHub Secrets:
#   SUPABASE_ACCESS_TOKEN   - Supabase CLI 인증 토큰
#   SUPABASE_PROJECT_ID     - 프로젝트 ID (supabase link 시 사용)
#   SUPABASE_DB_PASSWORD    - DB 비밀번호 (migrations push 시 사용)
#   VITE_SUPABASE_URL       - Supabase 프로젝트 URL (빌드 시 필요)
#   VITE_SUPABASE_ANON_KEY  - Supabase anon key (빌드 시 필요)
# =============================================================================

name: CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Supabase Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      migrations: ${{ steps.paths.outputs.migrations }}
      functions: ${{ steps.paths.outputs.functions }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: paths
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          base="$BEFORE_SHA"
          if [[ "$base" =~ ^0+$ ]]; then
            base="$(git hash-object -t tree /dev/null)"
          fi
          migrations=false
          functions=false
          migration_paths="$(git diff --name-only --no-renames "$base" "$HEAD_SHA" -- supabase/migrations/)"
          function_paths="$(git diff --name-only --no-renames "$base" "$HEAD_SHA" -- supabase/functions/ supabase/config.toml)"
          if [[ -n "$migration_paths" ]]; then
            migrations=true
          fi
          if [[ -n "$function_paths" ]]; then
            functions=true
          fi
          echo "migrations=$migrations" >> "$GITHUB_OUTPUT"
          echo "functions=$functions" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # 1. 타입 체크 + 린트 + 빌드
  # ===========================================================================
  build:
    name: Type Check & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint
        continue-on-error: false

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SITE_URL: https://www.baikalsys.kr
          VITE_DEFAULT_OG_IMAGE: /og-default.jpg
          VITE_GA_ID: ''

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ===========================================================================
  # 2. Supabase DB 마이그레이션 (main push + migration 변경 시만 실행)
  # ===========================================================================
  supabase-migrate:
    name: Supabase DB Migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.migrations == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Run DB migrations
        run: supabase db push --password ${{ secrets.SUPABASE_DB_PASSWORD }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  # 기존 자동 배포 대상 4개를 유지한다. 문의 함수 등은 별도 승인 배포 대상이다.
  supabase-functions:
    name: Deploy Supabase Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, changes, supabase-migrate]
    if: |
      always() && !cancelled() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.build.result == 'success' && needs.changes.result == 'success' &&
      needs.changes.outputs.functions == 'true' &&
      (needs.supabase-migrate.result == 'success' ||
       (needs.changes.outputs.migrations == 'false' && needs.supabase-migrate.result == 'skipped'))

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy sync-rss --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy sync-youtube --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy generate-sitemap --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy generate-og-image --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
